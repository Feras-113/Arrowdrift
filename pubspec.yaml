name: arrowdrift
description: "Arrowdrift - a calm, addictive arrow-escape puzzle with 5,100 levels."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  clock: ^1.1.1
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    - assets/sfx/
